<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Document</title> 
    <script src="./js/main.js" defer></script>
</head>
    <body>
      <header>
        <h1 id="titulo">Mi Tienda</h1>
      <nav>
        <ul>
          <li><a href="#" class="link">Inicio</a></li>
        </ul>
      </nav>
    </header>
    <main class="contenedor">
        <h1>🎛️ Electrodomesticos</h1>
        <p>
            Ingrese el electrodomestico que este deseando
        </p>
        <form id="formularioElectrodomesticos">
            <label for="idElectrodomesticos">
                Inserte aqui lo que busque
            </label>
            <input
                type="text"
                id="idElectrodomesticos"
                min="1"
                placeholder= "Ej : Heladera"
                required
            >
            <button type="submit">
                Buscar 
            </button>
        </form>
        <section id="resultado"></section>
        <h1>Algunos de nuestros productos</h1>
        <section id="catalogo"></section>
        <div id="imagen"></div>
        
    </main>

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</html>
