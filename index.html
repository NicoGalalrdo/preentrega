<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <title>Document</title> 
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script src="./js/main.js" defer></script>
    <body>
        <header>
      <h1 id="titulo">Mi negocio</h1>
      <nav>
        <ul>
          <li><a href="#" class="link">Inicio</a></li>
          <li><a href="#productos" class="link">Productos</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h2>Productos</h2>

      <section id="productos" class="productos"></section>

      <section>
        <h3>Agregar producto</h3>
        <form id="form-agregar-producto" class="form-agregar-producto">
          <input
            type="text"
            name="nombre"
            placeholder="Nombre del producto"
            id="input-nombre"
          />
          <input
            type="number"
            name="precio"
            placeholder="Precio del producto"
            id="input-precio"
          />
          <input
            type="text"
            name="imagen"
            placeholder="URL de la imagen del producto"
            id="input-imagen"
          />
          <input
            type="text"
            name="descripcion"
            placeholder="Descripcion del producto"
            id="input-descripcion"
          />
          <input type="submit" value="Agregar producto" />
        </form>
      </section>

      <section>
        <h3>Carrito</h3>
    
        <section id="carrito" class="productos"></section>
      </section>
    </main>
    <footer>
      <span>&copy;2026</span>
    </footer>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </body>

</html>
